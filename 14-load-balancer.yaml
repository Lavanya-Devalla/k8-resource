kind: Service
apiVersion: v1
metadata:
 name: nginx-lb
spec:
 type: LoadBalancer
 selector:
  project: expense
  component: backend
  environment: dev
  version: "1.0.0"
  demo: lb
ports:
 -protocol: TCP
 port: 80
 targetport: 80
 NodePort: 30007
---
kind: Pod
apiVersion: v1
metadata:
  name: backend-lb
  labels:
   project: expense
   component: backend
   environment: dev
   version: "1.0.0"
   demo: lb

spec:
 container:
  -name: nginx
  image: nginx  